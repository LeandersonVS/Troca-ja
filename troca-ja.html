<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Troca Já — Troque o que você tem pelo que você precisa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2563EB;
  --teal:#14B8A6;
  --bg:#F8FAFC;
  --white:#FFFFFF;
  --text:#0F172A;
  --gray:#64748B;
  --success:#22C55E;
  --grad: linear-gradient(120deg, var(--blue), var(--teal));
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 8px 24px -8px rgba(15,23,42,.12);
  --shadow-lg: 0 20px 40px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-display{font-family:'Sora',sans-serif;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input,textarea,select{font-family:inherit;}
img{max-width:100%; display:block;}
::selection{background:var(--teal); color:white;}

#app-shell{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; box-shadow: var(--shadow-lg); overflow-x:hidden;}
@media(min-width:900px){
  #app-shell{max-width:1180px;}
}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:10px;}

/* ---------- Utility ---------- */
.px{padding-left:20px;padding-right:20px;}
.container-wide{max-width:1180px;margin:0 auto;padding:0 24px;}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 22px; border-radius:14px; font-weight:600; font-size:15px;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  white-space:nowrap;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--grad); color:#fff; box-shadow:0 10px 20px -8px rgba(37,99,235,.5);}
.btn-primary:hover{box-shadow:0 14px 26px -8px rgba(37,99,235,.6);}
.btn-outline{background:#fff; color:var(--blue); border:1.5px solid #E2E8F0;}
.btn-outline:hover{border-color:var(--blue);}
.btn-ghost{background:#EEF2FF; color:var(--blue);}
.btn-success{background:var(--success); color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px;}
.card{background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid #EEF2F6;}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:5px 10px; border-radius:100px; background:#EEF2FF; color:var(--blue);}
.badge-green{background:#DCFCE7;color:#15803D;}
.badge-yellow{background:#FEF9C3;color:#A16207;}
.badge-red{background:#FEE2E2;color:#B91C1C;}
.input{
  width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid #E2E8F0; background:#fff;
  font-size:15px; color:var(--text); transition:border-color .15s;
}
.input:focus{outline:none; border-color:var(--blue);}
.label{font-size:13px; font-weight:600; color:var(--gray); margin-bottom:6px; display:block;}
.field{margin-bottom:16px;}
.section-title{font-size:22px; font-weight:700; font-family:'Sora',sans-serif; margin:0 0 4px;}
.section-sub{color:var(--gray); font-size:14px; margin:0 0 18px;}
.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}
.scale-pop{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}

/* ---------- Top bars ---------- */
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(248,250,252,.85); backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid #EDF1F5;
}
.logo{display:flex; align-items:center; gap:8px; font-family:'Sora',sans-serif; font-weight:800; font-size:19px;}
.logo-mark{width:34px;height:34px;flex-shrink:0;}

/* ---------- Landing ---------- */
.landing-nav{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;max-width:1180px;margin:0 auto;}
.landing-nav .links{display:none;gap:28px;font-weight:600;font-size:14.5px;color:var(--gray);}
@media(min-width:900px){.landing-nav .links{display:flex;}}
.hero{padding:36px 24px 10px; max-width:1180px; margin:0 auto;}
@media(min-width:900px){.hero{display:grid; grid-template-columns:1.05fr .95fr; gap:40px; align-items:center; padding:56px 24px 20px;}}
.hero h1{font-size:clamp(30px,6vw,50px); line-height:1.08; font-weight:800; margin:0 0 16px; letter-spacing:-0.02em;}
.hero h1 .accent{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero p{color:var(--gray); font-size:16.5px; line-height:1.6; margin:0 0 26px; max-width:480px;}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
.hero-illustration{position:relative; margin-top:32px;}
@media(min-width:900px){.hero-illustration{margin-top:0;}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #E2E8F0;border-radius:100px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:18px;box-shadow:var(--shadow);}

.steps-grid{display:grid; grid-template-columns:1fr; gap:16px; margin-top:20px;}
@media(min-width:700px){.steps-grid{grid-template-columns:repeat(4,1fr);}}
.step-card{background:#fff;border-radius:var(--radius);padding:22px 18px;box-shadow:var(--shadow);position:relative;border:1px solid #EEF2F6;}
.step-num{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px;}
.step-card h4{margin:0 0 6px;font-size:15.5px;}
.step-card p{margin:0;font-size:13.5px;color:var(--gray);line-height:1.5;}

.cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px;}
@media(min-width:700px){.cat-grid{grid-template-columns:repeat(6,1fr);}}
.cat-chip{background:#fff;border-radius:16px;padding:18px 8px;text-align:center;box-shadow:var(--shadow);border:1px solid #EEF2F6;transition:transform .15s;}
.cat-chip:hover{transform:translateY(-3px);}
.cat-chip .ic{font-size:26px;margin-bottom:8px;}
.cat-chip span{font-size:12.5px;font-weight:600;color:var(--text);}

.landing-section{padding:44px 24px; max-width:1180px; margin:0 auto;}
.footer{background:var(--text); color:#CBD5E1; padding:38px 24px; margin-top:20px;}
.footer .container-wide{display:flex;flex-direction:column;gap:18px;}
.footer .logo{color:#fff;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:sticky; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #EDF1F5;
  display:flex; justify-content:space-around; align-items:center; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:40;
}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--gray); padding:6px 10px; border-radius:12px; transition:.15s;}
.nav-item.active{color:var(--blue);}
.nav-item .ic{font-size:20px;}
.nav-item.fab{background:var(--grad); color:#fff; width:44px;height:44px;border-radius:50%;justify-content:center;margin-top:-22px;box-shadow:0 8px 18px -4px rgba(37,99,235,.55);font-size:22px;}
.nav-item.fab span.lbl{display:none;}

/* ---------- Product cards ---------- */
.product-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:4px 20px 20px;}
@media(min-width:700px){.product-grid{grid-template-columns:repeat(3,1fr);padding-left:24px;padding-right:24px;}}
@media(min-width:1000px){.product-grid{grid-template-columns:repeat(4,1fr);}}
.pcard{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #EEF2F6;cursor:pointer;transition:transform .15s;}
.pcard:hover{transform:translateY(-3px);}
.pcard .img-wrap{position:relative;aspect-ratio:4/3;background:#E2E8F0;overflow:hidden;}
.pcard .img-wrap img{width:100%;height:100%;object-fit:cover;}
.pcard .heart{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 10px rgba(0,0,0,.12);}
.pcard .body{padding:11px 12px 13px;}
.pcard .cat{font-size:10.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.03em;}
.pcard .name{font-size:14px;font-weight:700;margin:3px 0 5px;line-height:1.25;}
.pcard .cond{font-size:11.5px;color:var(--gray);margin-bottom:6px;}
.pcard .loc{font-size:11.5px;color:var(--gray);display:flex;align-items:center;gap:3px;margin-bottom:8px;}
.pcard .owner{display:flex;align-items:center;gap:6px;margin-bottom:9px;}
.pcard .owner img{width:20px;height:20px;border-radius:50%;object-fit:cover;}
.pcard .owner span{font-size:11.5px;color:var(--gray);font-weight:500;}

/* ---------- Search / filters ---------- */
.search-wrap{padding:6px 20px 12px;}
.search-box{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #E2E8F0;border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);}
.search-box input{border:none;flex:1;font-size:14.5px;background:transparent;}
.search-box input:focus{outline:none;}
.filter-row{display:flex; gap:8px; overflow-x:auto; padding:12px 20px 4px; scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0; padding:9px 15px; border-radius:100px; background:#fff; border:1.5px solid #E2E8F0; font-size:13px; font-weight:600; color:var(--gray); white-space:nowrap;}
.filter-chip.active{background:var(--grad); color:#fff; border-color:transparent;}

/* ---------- Auth screens ---------- */
.auth-wrap{max-width:420px;margin:0 auto;padding:20px 24px 60px;}
.auth-illustration{display:flex;justify-content:center;margin:10px 0 24px;}
.divider{display:flex;align-items:center;gap:12px;color:var(--gray);font-size:12.5px;margin:18px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#E2E8F0;}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--gray);line-height:1.5;}
.checkbox-row input{margin-top:3px;}

/* ---------- Product detail ---------- */
.gallery{position:relative;aspect-ratio:1/1;max-height:420px;background:#E2E8F0;}
.gallery img{width:100%;height:100%;object-fit:cover;}
.gallery-dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
.gallery-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);}
.gallery-dots span.on{background:#fff;width:18px;border-radius:4px;}
.detail-body{padding:20px;}
.owner-row{display:flex;align-items:center;gap:12px;padding:14px;background:#fff;border-radius:16px;border:1px solid #EEF2F6;margin:14px 0;}
.owner-row img{width:46px;height:46px;border-radius:50%;object-fit:cover;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.info-grid .it{background:#fff;border:1px solid #EEF2F6;border-radius:14px;padding:12px 14px;}
.info-grid .it .k{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px;}
.info-grid .it .v{font-size:14px;font-weight:600;}
.accept-box{background:linear-gradient(135deg,#EEF2FF,#ECFDF5);border-radius:16px;padding:16px;margin:16px 0;}
.sticky-cta{position:sticky;bottom:0;background:#fff;border-top:1px solid #EDF1F5;padding:14px 20px;display:flex;gap:10px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media(min-width:700px){.modal-overlay{align-items:center;}}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px;}
@media(min-width:700px){.modal-sheet{border-radius:24px;}}
.modal-handle{width:40px;height:4px;background:#E2E8F0;border-radius:10px;margin:0 auto 16px;}
.offer-option{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid #E2E8F0;border-radius:14px;margin-bottom:10px;cursor:pointer;}
.offer-option.selected{border-color:var(--blue);background:#EEF2FF;}
.offer-option img{width:48px;height:48px;border-radius:10px;object-fit:cover;}

/* ---------- Match celebration ---------- */
.match-overlay{position:fixed;inset:0;background:linear-gradient(160deg,#2563EB,#14B8A6);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px;}
.match-arrows{font-size:56px;margin-bottom:6px;animation:spin-in .7s ease both;}
@keyframes spin-in{from{transform:rotate(-90deg) scale(.4);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
.match-title{font-family:'Sora',sans-serif;font-weight:800;font-size:32px;margin:10px 0 6px;}
.match-pair{display:flex;align-items:center;gap:16px;margin:26px 0;}
.match-pair img{width:84px;height:84px;border-radius:18px;object-fit:cover;border:3px solid rgba(255,255,255,.6);}
.match-pair .vs{font-size:22px;}

/* ---------- Chat ---------- */
.chat-header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid #EDF1F5;}
.chat-header img{width:42px;height:42px;border-radius:50%;object-fit:cover;}
.trade-banner{margin:10px 20px;background:#F1F5F9;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;}
.safety-banner{margin:10px 20px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:14px;padding:11px 14px;font-size:12.5px;color:#92400E;display:flex;gap:8px;}
.messages{padding:12px 20px;display:flex;flex-direction:column;gap:10px;min-height:280px;}
.bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;}
.bubble.me{align-self:flex-end;background:var(--grad);color:#fff;border-bottom-right-radius:4px;}
.bubble.them{align-self:flex-start;background:#fff;border:1px solid #EEF2F6;border-bottom-left-radius:4px;}
.bubble .time{font-size:10px;opacity:.7;margin-top:3px;display:block;}
.chat-input-row{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #EDF1F5;position:sticky;bottom:0;}
.chat-input-row input{flex:1;}
.icon-btn{width:44px;height:44px;border-radius:14px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:calc(100% - 40px);max-width:420px;}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:fadeIn .3s ease;}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:50px 30px;color:var(--gray);}
.empty .ic{font-size:42px;margin-bottom:12px;}
.empty h4{color:var(--text);margin:0 0 6px;font-size:16px;}
.empty p{font-size:13.5px;margin:0;}

/* ---------- Stats ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px;}
.stat-card{background:#fff;border-radius:16px;padding:16px;border:1px solid #EEF2F6;box-shadow:var(--shadow);}
.stat-card .n{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.stat-card .l{font-size:12px;color:var(--gray);font-weight:600;margin-top:2px;}

/* ---------- Skeleton ---------- */
.skel{background:linear-gradient(90deg,#EEF2F6 25%,#E2E8F0 37%,#EEF2F6 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:14px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- Misc ---------- */
.section-header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 6px;}
.link-btn{font-size:13px;font-weight:700;color:var(--blue);}
.avatar-ring{border-radius:50%;padding:2px;background:var(--grad);display:inline-block;}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-radius:16px;border:1px solid #EEF2F6;margin-bottom:10px;}
.switch{width:42px;height:24px;border-radius:100px;background:#E2E8F0;position:relative;transition:.2s;flex-shrink:0;}
.switch.on{background:var(--success);}
.switch .dot{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on .dot{left:20px;}
.admin-metric{background:#fff;border-radius:16px;padding:16px;border:1px solid #EEF2F6;}
.bar{height:8px;border-radius:6px;background:#EEF2FF;overflow:hidden;}
.bar > div{height:100%;background:var(--grad);border-radius:6px;}
</style>
</head>
<body>
<div id="app-shell">
  <div id="app"></div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ============================================================
   TROCA JÁ — protótipo de front-end interativo (dados mockados)
   ============================================================ */

/* ---------- Helpers ---------- */
const $ = sel => document.querySelector(sel);
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
function toast(msg, icon='✅'){
  const wrap = $('#toastWrap');
  const t = el(`<div class="toast">${icon} ${msg}</div>`);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}
function avatar(seed){ return `https://i.pravatar.cc/150?u=${encodeURIComponent(seed)}`; }
function photo(seed,w=500,h=380){ return `https://picsum.photos/seed/${encodeURIComponent(seed)}/${w}/${h}`; }
const CATS = [
  {k:'eletronicos',label:'Eletrônicos',ic:'🔌'},
  {k:'celulares',label:'Celulares',ic:'📱'},
  {k:'computadores',label:'Computadores',ic:'💻'},
  {k:'videogames',label:'Videogames',ic:'🎮'},
  {k:'moveis',label:'Móveis',ic:'🛋️'},
  {k:'eletrodomesticos',label:'Eletrodomésticos',ic:'🧺'},
  {k:'roupas',label:'Roupas',ic:'👕'},
  {k:'bicicletas',label:'Bicicletas',ic:'🚲'},
  {k:'livros',label:'Livros',ic:'📚'},
  {k:'instrumentos',label:'Instrumentos',ic:'🎸'},
  {k:'esportes',label:'Esportes',ic:'⚽'},
  {k:'outros',label:'Outros',ic:'📦'},
];
const catIcon = k => (CATS.find(c=>c.k===k)||{}).ic || '📦';
const catLabel = k => (CATS.find(c=>c.k===k)||{}).label || 'Outros';

/* ---------- Mock DB ---------- */
const DB = {
  users: [
    {id:'u_me', name:'Você', city:'São Paulo', state:'SP', avatarSeed:'me-user', rating:4.9, trades:1, joined:'2026-03-01'},
    {id:'u1', name:'João Pedro', city:'São Paulo', state:'SP', avatarSeed:'joao', rating:4.9, trades:12, joined:'2025-11-02'},
    {id:'u2', name:'Carla Menezes', city:'Belo Horizonte', state:'MG', avatarSeed:'carla', rating:4.7, trades:8, joined:'2025-09-14'},
    {id:'u3', name:'Rafael Santos', city:'Curitiba', state:'PR', avatarSeed:'rafael', rating:5.0, trades:21, joined:'2025-06-20'},
    {id:'u4', name:'Bianca Alves', city:'São Paulo', state:'SP', avatarSeed:'bianca', rating:4.6, trades:5, joined:'2026-01-11'},
    {id:'u5', name:'Diego Ferreira', city:'Porto Alegre', state:'RS', avatarSeed:'diego', rating:4.8, trades:15, joined:'2025-08-03'},
  ],
  products: [
    {id:'p1', ownerId:'u1', name:'iPhone 12 128GB', category:'celulares', condition:'Bom estado', brand:'Apple', model:'iPhone 12', year:'2021', city:'São Paulo', state:'SP', desc:'iPhone 12 128GB azul, bateria 89%, sem trincos, acompanha carregador.', photos:['iphone12-a','iphone12-b','iphone12-c'], wants:['videogames','computadores'], status:'ativo', createdAt:'2026-08-01'},

/* ============================================================

   ============================================================ */
function render(){
  const app = $('#app');
  let html = '';
  switch(state.screen){
    case 'landing': html = ScreenLanding(); break;
    case 'login': html = ScreenLogin(); break;
    case 'signup': html = ScreenSignup(); break;
    case 'forgot': html = ScreenForgot(); break;
    case 'feed': html = ScreenFeed(); break;
    case 'product': html = ScreenProduct(state.params.id); break;
    case 'publish': html = ScreenPublish(); break;
    case 'myProducts': html = ScreenMyProducts(); break;
    case 'matches': html = ScreenMatches(); break;
    case 'chat': html = ScreenChat(state.params.id); break;
    case 'profile': html = ScreenProfile(state.params.id || 'u_me'); break;
    case 'notifications': html = ScreenNotifications(); break;
    case 'settings': html = ScreenSettings(); break;
    case 'admin': html = ScreenAdmin(); break;
    default: html = ScreenLanding();
  }
  app.innerHTML = html;
  attachHandlers();
}

const AUTH_SCREENS = ['feed','product','publish','myProducts','matches','chat','profile','notifications','settings'];
function shell(innerHtml, {nav:navName=null, topbar=null}={}){
  return `
    ${topbar || ''}
    <div class="fade-in">${innerHtml}</div>
    ${navName ? bottomNav(navName) : ''}
  `;
}

function bottomNav(active){
  const items = [
    {k:'home', ic:ICON.home, label:'Início', screen:'feed'},
    {k:'explore', ic:ICON.explore, label:'Explorar', screen:'feed'},
    {k:'add', ic:ICON.add, label:'', screen:'publish', fab:true},
    {k:'matches', ic:ICON.matches, label:'Matches', screen:'matches'},
    {k:'profile', ic:ICON.profile, label:'Perfil', screen:'profile'},
  ];
  return `<div class="bottom-nav">
    ${items.map(it=>`
      <button class="nav-item ${it.fab?'fab':''} ${active===it.k?'active':''}" data-nav="${it.screen}">
        <span class="ic">${it.ic}</span>${it.fab?'':`<span class="lbl">${it.label}</span>`}
      </button>
    `).join('')}
  </div>`;
}

function topBarApp(title, {back=false, right=''}={}){
  return `<div class="topbar">

let feedFilter = 'todos';
function ScreenFeed(){
  const me = DB.users.find(u=>u.id==='u_me');
  const q = (state.params.q||'').toLowerCase();
  let items = DB.products.filter(p=>p.ownerId!=='u_me' && p.status==='ativo');
  if(feedFilter!=='todos') items = items.filter(p=>p.category===feedFilter);
  if(q) items = items.filter(p=>p.name.toLowerCase().includes(q));

  const top = `<div class="topbar">
    <div class="logo">${logoMark(30)} Troca Já</div>
    <div style="display:flex;gap:14px;align-items:center;">
      <button data-nav="notifications" class="icon-btn" style="width:36px;height:36px;position:relative;">${ICON.bell}
        <span style="position:absolute;top:5px;right:6px;width:8px;height:8px;background:#EF4444;border-radius:50%;"></span>
      </button>
    </div>
  </div>`;

  const body = `
    <div style="padding:16px 20px 4px;">
      <h2 class="font-display" style="margin:0 0 2px;font-size:19px;">Olá, ${me.name.split(' ')[0]} 👋</h2>
      <p style="margin:0;color:var(--gray);font-size:13.5px;">O que você está procurando hoje?</p>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input id="searchInput" placeholder="Procure celulares, videogames, notebooks..." value="${state.params.q||''}">
      </div>
    </div>
    <div class="filter-row">
      <button class="filter-chip ${feedFilter==='todos'?'active':''}" data-filter="todos">Todos</button>
      ${CATS.map(c=>`<button class="filter-chip ${feedFilter===c.k?'active':''}" data-filter="${c.k}">${c.ic} ${c.label}</button>`).join('')}
    </div>

    <div class="section-header"><h3 style="font-size:15.5px;margin:0;">Recomendados para você</h3></div>
    ${productGrid(items.slice(0,4))}

    <div class="section-header"><h3 style="font-size:15.5px;margin:0;">Perto de você · ${me.city}</h3></div>
    ${productGrid(items.filter(p=>p.city===me.city))}

    <div class="section-header"><h3 style="font-size:15.5px;margin:0;">Novidades</h3></div>
    ${productGrid([...items].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,4))}
    <div style="height:12px;"></div>
  `;

function openOfferModal(productId){
  const p = DB.products.find(x=>x.id===productId);
  if(!p) return;
  if(p.ownerId==='u_me'){ toast('Esse produto já é seu 🙂','ℹ️'); return; }
  state.offerModal = productId;
  state.offerSelectedId = null;
  renderModal();
}
function myOwnedActiveProducts(){
  return DB.products.filter(p=>p.ownerId==='u_me' && p.status!=='trocado');
}
function renderModal(){
  const overlayExisting = document.getElementById('modalOverlay');
  if(overlayExisting) overlayExisting.remove();
  if(!state.offerModal) return;
  const p = DB.products.find(x=>x.id===state.offerModal);
  const mine = myOwnedActiveProducts();
  const overlay = el(`<div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet scale-pop">
      <div class="modal-handle"></div>
      <h3 style="margin:0 0 4px;font-size:18px;">Você está interessado em:</h3>
      <div style="display:flex;align-items:center;gap:10px;margin:10px 0 18px;padding:10px;background:#F8FAFC;border-radius:14px;">
        <img src="${photo(p.photos[0],80,80)}" style="width:50px;height:50px;border-radius:10px;object-fit:cover;">
        <div style="font-weight:700;font-size:14.5px;">${p.name}</div>
      </div>
      <h4 style="margin:0 0 10px;font-size:14.5px;">Você pode oferecer:</h4>
      <div id="offerList">
        ${mine.length ? mine.map(m=>`
          <div class="offer-option" data-offer="${m.id}">
            <img src="${photo(m.photos[0],80,80)}">
            <div style="flex:1;">
              <div style="font-weight:700;font-size:14px;">${m.name}</div>
              <div style="font-size:12px;color:var(--gray);">${m.condition}</div>
            </div>
            <span class="check-mark" style="font-size:16px;color:var(--blue);"></span>
          </div>`).join('') : `<div class="empty" style="padding:20px;"><div class="ic">📦</div><h4>Você ainda não tem produtos</h4><p>Cadastre um produto para propor trocas.</p></div>`}
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button class="btn btn-outline btn-block" id="cancelOffer">Cancelar</button>
        <button class="btn btn-primary btn-block" id="sendOffer" ${mine.length?'':'disabled style="opacity:.5;"'}>Enviar proposta</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);

  overlay.querySelectorAll('[data-offer]').forEach(node=>{
    node.addEventListener('click', ()=>{
      overlay.querySelectorAll('.offer-option').forEach(n=>n.classList.remove('selected'));
      node.classList.add('selected');
      node.querySelector('.check-mark').textContent = '✔️';
      state.offerSelectedId = node.getAttribute('data-offer');
    });
  });
  overlay.querySelector('#cancelOffer').addEventListener('click', ()=>{ state.offerModal=null; renderModal(); });
  overlay.querySelector('#sendOffer')?.addEventListener('click', ()=>{
    if(!state.offerSelectedId){ toast('Escolha um produto para oferecer','⚠️'); return; }
    sendProposal(p.id, state.offerSelectedId);
    state.offerModal = null; renderModal();
  });
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ state.offerModal=null; renderModal(); } });
}

function sendProposal(wantedProductId, offeredProductId){
  const wanted = DB.products.find(x=>x.id===wantedProductId);
  const offered = DB.products.find(x=>x.id===offeredProductId);
  toast('Proposta enviada! Aguardando resposta...', '📤');
  offered.status = 'em_negociacao';
  // Simula o outro usuário aceitando após um curto intervalo
  setTimeout(()=>{
    const matchId = 'match_'+Date.now();
    DB.matches.unshift({id:matchId, userAId:'u_me', productAId:offered.id, userBId:wanted.ownerId, productBId:wanted.id, createdAt:new Date().toISOString().slice(0,10)});
    DB.messages[matchId] = [];
    DB.notifications.unshift({id:'n_'+Date.now(), type:'match', text:`Você e ${DB.users.find(u=>u.id===wanted.ownerId).name} deram match! ${offered.name} ↔ ${wanted.name}.`, time:'agora', read:false});
    showMatchCelebration(matchId);
  }, 1600);
}

function showMatchCelebration(matchId){
  const m = DB.matches.find(x=>x.id===matchId);
  const other = DB.users.find(u=>u.id===m.userBId);
  const myP = DB.products.find(p=>p.id===m.productAId);
  const otherP = DB.products.find(p=>p.id===m.productBId);
  const overlay = el(`<div class="match-overlay" id="matchOverlay">
    <div class="match-arrows">🔄</div>
    <div class="match-title">DEU MATCH! 🎉</div>
    <p style="opacity:.95;font-size:15px;max-width:300px;">Vocês encontraram uma possível troca.</p>
    <div class="match-pair">
      <div style="text-align:center;">
        <img src="${photo(myP.photos[0],120,120)}"><div style="font-size:12px;margin-top:6px;">${myP.name}</div>
      </div>
      <div class="vs">↔</div>
      <div style="text-align:center;">
        <img src="${photo(otherP.photos[0],120,120)}"><div style="font-size:12px;margin-top:6px;">${otherP.name}</div>
      </div>
    </div>
    <button class="btn" style="background:#fff;color:var(--blue);width:80%;max-width:300px;" id="goChat">Conversar sobre a troca</button>
    <button class="btn" style="color:#fff;margin-top:10px;font-size:13px;opacity:.85;" id="closeMatch">Continuar explorando</button>
  </div>`);
  document.body.appendChild(overlay);
  overlay.querySelector('#goChat').addEventListener('click', ()=>{ overlay.remove(); nav('chat', {id:matchId}); });
  overlay.querySelector('#closeMatch').addEventListener('click', ()=>{ overlay.remove(); render(); });
}

            <div style="font-size:11.5px;color:var(--gray);margin-top:3px;">${n.time}</div>
          </div>
          ${!n.read ? `<div style="width:8px;height:8px;background:var(--blue);border-radius:50%;flex-shrink:0;"></div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
  return shell(body, {nav:null, topbar: top});
}

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function attachHandlers(){
  const app = $('#app');

  app.querySelectorAll('[data-nav]').forEach(node=>{
    node.addEventListener('click', (e)=>{
      const screen = node.getAttribute('data-nav');
      const id = node.getAttribute('data-id');
      if(!AUTH_SCREENS.includes(screen) || state.loggedIn || screen==='landing' || screen==='login' || screen==='signup' || screen==='forgot'){
        nav(screen, id ? {id} : {});
      } else {
        nav('login');
      }
    });
  });

  app.querySelectorAll('[data-back]').forEach(node=>{
    node.addEventListener('click', ()=>{
      if(state.screen==='chat') nav('matches');
      else if(state.screen==='product') nav('feed');
      else if(state.screen==='settings') nav('profile');
      else nav(state.loggedIn ? 'feed' : 'landing');
    });
  });

  app.querySelectorAll('[data-interest]').forEach(node=>{
    node.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!state.loggedIn){ nav('login'); return; }
      const id = node.getAttribute('data-interest');
      openOfferModal(id);
    });
  });

  app.querySelectorAll('[data-filter]').forEach(node=>{
    node.addEventListener('click', ()=>{ feedFilter = node.getAttribute('data-filter'); render(); });
  });

  const searchInput = $('#searchInput');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{ state.params.q = searchInput.value; });
    searchInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') render(); });
  }

  const loginForm = app.querySelector('[data-form="login"]');
  if(loginForm) loginForm.addEventListener('submit', (e)=>{ e.preventDefault(); doLogin(); });
  const signupForm = app.querySelector('[data-form="signup"]');
  if(signupForm) signupForm.addEventListener('submit', (e)=>{ e.preventDefault(); doLogin('Conta criada com sucesso! Bem-vindo(a) 🎉'); });
  const forgotForm = app.querySelector('[data-form="forgot"]');
  if(forgotForm) forgotForm.addEventListener('submit', (e)=>{ e.preventDefault(); toast('Link de recuperação enviado para o seu e-mail.','📩'); nav('login'); });

  const googleBtn = app.querySelector('[data-action="google-login"]');
  if(googleBtn) googleBtn.addEventListener('click', ()=>doLogin());

  const sendMsgBtn = app.querySelector('#sendMsgBtn');
  if(sendMsgBtn){
    const doSend = ()=>{
      const input = $('#chatInput');
      const text = input.value.trim();
      if(!text) return;
      const matchId = app.querySelector('[data-match]').getAttribute('data-match');
      const now = new Date(); const time = now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
      DB.messages[matchId] = DB.messages[matchId] || [];
      DB.messages[matchId].push({from:'u_me', text, time});
      input.value='';
      render();
      setTimeout(()=>{ $('#msgList')?.scrollIntoView({block:'end'}); }, 50);
      // resposta automática simulada
      setTimeout(()=>{
        const m = DB.matches.find(x=>x.id===matchId);
        const other = DB.users.find(u=>u.id===m.userBId);
        const replies = ['Combinado! 👍','Show, pode ser sim.','Perfeito, te aviso quando estiver por aí.','Boa! Vamos marcar então.'];
        DB.messages[matchId].push({from: m.userBId, text: replies[Math.floor(Math.random()*replies.length)], time: time});
        if(state.screen==='chat') render();
      }, 1400);
    };
    sendMsgBtn.addEventListener('click', doSend);
    $('#chatInput')?.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doSend(); });
  }

  app.querySelectorAll('[data-action="pause-product"]').forEach(n=>n.addEventListener('click', ()=>toast('Produto pausado.','⏸️')));
  app.querySelectorAll('[data-action="delete-product"]').forEach(n=>n.addEventListener('click', ()=>toast('Produto excluído.','🗑️')));
  app.querySelectorAll('[data-action="publish-product"]').forEach(n=>n.addEventListener('click', ()=>{ toast('Produto publicado com sucesso!','🎉'); nav('myProducts'); }));
  app.querySelectorAll('[data-toggle-cat]').forEach(n=>n.addEventListener('click', ()=>n.classList.toggle('active')));
  app.querySelectorAll('[data-action="share"]').forEach(n=>n.addEventListener('click', ()=>toast('Link copiado para a área de transferência.','🔗')));
  app.querySelectorAll('[data-action="report"]').forEach(n=>n.addEventListener('click', ()=>toast('Denúncia enviada. Nossa equipe vai analisar.','🚩')));
  app.querySelectorAll('[data-action="block"]').forEach(n=>n.addEventListener('click', ()=>toast('Usuário bloqueado.','🚫')));
  app.querySelectorAll('[data-action="logout"]').forEach(n=>n.addEventListener('click', ()=>{ state.loggedIn=false; nav('landing'); }));
  app.querySelectorAll('[data-switch]').forEach(n=>n.addEventListener('click', ()=>n.classList.toggle('on')));
  app.querySelectorAll('[data-action="add-photo"]').forEach(n=>n.addEventListener('click', ()=>toast('Foto adicionada ao produto.','📷')));
}

function doLogin(msg){
  state.loggedIn = true;
  toast(msg || 'Login realizado com sucesso!', '👋');
  nav('feed');
}

/* ---------- Boot ---------- */
render();
</script>
